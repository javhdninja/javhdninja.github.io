<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open in Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        h1 {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 15px;
        }
        .message {
            color: #666;
            font-size: 1.05em;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .instructions {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 30px;
            text-align: left;
            border-radius: 5px;
            color: #555;
            font-size: 0.95em;
        }
        .instructions p {
            margin-bottom: 8px;
        }
        .instructions strong {
            color: #667eea;
        }
        /* BUTTON STYLES - Important: Use <a> tag, not <button> */
        .cta-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            width: 100%;
            text-decoration: none;
            display: inline-block;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .cta-button:active {
            transform: translateY(0);
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 0.85em;
        }
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.4em;
            }
            .icon {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🌐</div>
        <h1>Open in Browser</h1>
        <p class="message">For the best experience, please open this link in your default browser.</p>
        
        <div class="instructions">
            <p><strong>How to open:</strong></p>
            <p>1. Tap the link below</p>
            <p>2. Instagram will ask for confirmation</p>
            <p>3. Tap "Continue" to open in your browser</p>
        </div>

        <!-- IMPORTANT: Use <a> tag, NOT <button> or JavaScript redirect -->
        <!-- This allows Instagram to detect external link and show "You're leaving our app" popup -->
        <a href="index.html" class="cta-button">Open in Browser</a>
        
        <div class="footer">
            <p>If you see a popup, tap "Continue" to proceed.</p>
        </div>
    </div>
</body>
</html>
