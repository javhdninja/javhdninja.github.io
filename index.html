        function getDeviceOS() {
            const ua = navigator.userAgent;
            
            if (/android/i.test(ua)) {
                return 'android';
            }
            if (/iphone|ipad|ipod/i.test(ua)) {
                return 'ios';
            }
            return 'unknown';
        }

            } else if (os === 'ios') {

            } else {

            currentLanguage = langMap[langCode] || 'en';
            return currentLanguage;

                divBtn.className = 'overlaybutton';
                const t = translations[currentLanguage];
                divBtn.textContent = t.mainButton;
                divBtn.style.display = 'none';

                img.onerror = function() {
                    this.src = 'https://picsum.photos/300/400?random=';
                };
                
                link.appendChild(img);
                link.appendChild(divBtn);
                imageItem.appendChild(link);
                imageGrid.appendChild(imageItem);
            });
        }

        async function loadImages() {
            try {
                const response = await fetch('images-data.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                allImages = data.images || [];
                
                if (allImages.length > 0) {
                    displayRandomImages();
                } else {
                    console.warn('No images found, using placeholders');
                    for (let i = 1; i <= 100; i++) {
                        allImages.push(`https://picsum.photos/300/400?random=${i}`);
                    }
                    displayRandomImages();
                }
            } catch (error) {
                console.error('Error loading images:', error);
                
                const imageGrid = document.getElementById('imageGrid');
                imageGrid.innerHTML = '<div class="loading">Failed to load images. Using placeholders...</div>';
                
                setTimeout(() => {
                    for (let i = 1; i <= 100; i++) {
                        allImages.push(`https://picsum.photos/300/400?random=${i}`);
                    }
                    displayRandomImages();
                }, 1000);
            }
        }
        var params = new URLSearchParams(window.location.search);
        var post = params.get('post');
        const title = document.querySelector('h1');
        if(post) {
            title.textContent = 'Jav Code: Post ' + post;
        }
        if(!post) {
            title.textContent = 'Jav Code Finder';
        }
    </script>
</body>
</html>
